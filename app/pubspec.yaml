name: group_trip
description: 團體自由行 Android 用戶端（Flutter）。旅程為資料根，離線優先。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^7.1.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  flutter_timezone: ^5.1.1
  path_provider: ^2.1.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTC-Bold.ttf
          weight: 700
