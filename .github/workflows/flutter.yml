name: Flutter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  regenerate-goldens:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'cursor/'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens test/screenshot_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: app/test/goldens/*.png
          retention-days: 7

  invite-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - uses: browser-actions/setup-chrome@v1
      - name: Point Flutter at Chrome
        run: echo "CHROME_EXECUTABLE=$(which google-chrome || which chromium)" >> "$GITHUB_ENV"
      - run: npm ci --prefix rules-tests
      - run: flutter pub get
        working-directory: app
      - name: Build invite emulator page
        working-directory: app
        run: >
          flutter build web --profile --no-wasm-dry-run
          --dart-define=FIRESTORE_EMULATOR_HOST=127.0.0.1
          --dart-define=FIRESTORE_EMULATOR_PORT=8080
          --dart-define=AUTH_EMULATOR_HOST=127.0.0.1
          --dart-define=AUTH_EMULATOR_PORT=9099
          -t integration_test/invite_emulator_test.dart
      - name: Invite create and join against Firestore rules
        run: |
          chmod +x app/tool/run_invite_emulator.sh
          npx --prefix rules-tests firebase emulators:exec --project demo-app --only auth,firestore \
            "bash app/tool/run_invite_emulator.sh"

  rules-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration/rules-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integration/rules-contract/package-lock.json
      - run: npm ci
      - run: npx firebase emulators:exec --project demo-app --only firestore "npm test"
